name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout dsh-research-core (shared REP peer)
        uses: actions/checkout@v7
        with:
          repository: PerryLink/dsh-research-core
          path: .ci/dsh-research-core
      - name: Point the dev dependency at the checkout
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.devDependencies['@perrylink/dsh-research-core']='file:.ci/dsh-research-core';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Build the shared core checkout
        shell: bash
        run: |
          pnpm --dir .ci/dsh-research-core install --no-frozen-lockfile
          pnpm --dir .ci/dsh-research-core run build
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Gate
        shell: bash
        run: |
          npm run build --if-present
          pnpm run typecheck
          pnpm test
      - name: Publish to npm
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v$v"
          npm publish --provenance --access public
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
